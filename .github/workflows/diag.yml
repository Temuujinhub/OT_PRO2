name: Diag
on: workflow_dispatch
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect port 80
        env:
          HOST: ${{ secrets.DROPLET_HOST }}
          USER: ${{ secrets.DROPLET_USER }}
          SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' "$SSH_KEY" > /tmp/key && chmod 600 /tmp/key
          ssh -i /tmp/key -o StrictHostKeyChecking=no "$USER@$HOST" '
            echo "== listeners =="; ss -tlnp | head -20
            echo "== docker ps =="; docker ps --format "{{.Names}} {{.Image}} {{.Ports}} {{.Status}}" 2>/dev/null
            echo "== nginx service =="; systemctl is-active nginx 2>/dev/null; systemctl is-active apache2 2>/dev/null
            echo "== whats on 80 =="; curl -s -m 5 -o /dev/null -w "%{http_code} " http://localhost/; curl -s -m 5 http://localhost/ | head -c 300
            echo; echo "== resources =="; free -m | head -2; df -h / | tail -1; nproc
          ' > /tmp/out.txt 2>&1 || true
          B64=$(base64 -w0 /tmp/out.txt)
          SHA=$(curl -s -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/${{ github.repository }}/contents/deploy-log.txt | python3 -c "import json,sys;d=json.load(sys.stdin);print(d.get('sha',''))" || true)
          curl -s -X PUT -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/${{ github.repository }}/contents/deploy-log.txt -d "{\"message\":\"diag log [skip ci]\",\"content\":\"$B64\"$( [ -n "$SHA" ] && echo ",\"sha\":\"$SHA\"" )}" -o /dev/null
