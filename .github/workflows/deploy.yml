name: Deploy to test server

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          HOST: ${{ secrets.DROPLET_HOST }}
          USER: ${{ secrets.DROPLET_USER }}
          SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          printf '%s\n' "$SSH_KEY" > /tmp/key
          chmod 600 /tmp/key
          ssh -i /tmp/key -o StrictHostKeyChecking=no -o ConnectTimeout=20 "$USER@$HOST" bash -s <<EOF
          set -e
          export DEBIAN_FRONTEND=noninteractive
          if ! command -v docker >/dev/null; then
            curl -fsSL https://get.docker.com | sh
          fi
          if ! docker compose version >/dev/null 2>&1; then
            apt-get install -y docker-compose-plugin
          fi
          command -v git >/dev/null || apt-get install -y git
          mkdir -p /opt/oasis
          if [ ! -d /opt/oasis/repo/.git ]; then
            git clone https://github.com/${{ github.repository }}.git /opt/oasis/repo
          fi
          cd /opt/oasis/repo
          git fetch origin main
          git reset --hard origin/main
          cat > .env <<ENV
          JWT_SECRET=$JWT_SECRET
          ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY
          DB_PASSWORD=$DB_PASSWORD
          ENV
          docker compose up -d --build
          docker image prune -f
          sleep 20
          curl -sf http://localhost/api/v1/health
          echo "DEPLOY OK"
          EOF

      - name: Smoke test from runner
        run: |
          sleep 5
          curl -sf "http://${{ secrets.DROPLET_HOST }}/api/v1/health"
          echo "SMOKE OK"
